name: Update Loon rules

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sources.json'
      - 'scripts/**'
      - 'tests/**'
      - 'snapshots/**'
      - 'overrides/**'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: loon-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v

  update:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Download, validate and merge all sources
        run: python scripts/build.py
      - name: Verify generated rules preserve the local baseline
        run: python -m unittest discover -s tests -v
      - name: Publish changes
        run: |
          git add rules reports
          if git diff --cached --quiet; then
            echo 'No rule changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update generated Loon rules'
          git push origin HEAD:main
